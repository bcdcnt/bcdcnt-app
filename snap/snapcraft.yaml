name: bcdcnt
title: Bài ca đi cùng năm tháng
summary: Kho nhạc Việt Nam xưa — nghe, tải, karaoke, bình luận
description: |
  BCĐCNT (Bài ca đi cùng năm tháng) là kho lưu trữ những bài hát Việt Nam qua các thời kỳ: hơn 14.000 bản thu, thông tin về hơn 1.300 nhạc sĩ và 3.000 nghệ sĩ, nhà thơ, lời bài hát, karaoke, playlist và một cộng đồng người nghe gắn bó từ nhiều năm nay.

  Bản desktop có:
  * Trình phát nhạc với hàng đợi, phát ngẫu nhiên, lặp lại, đài phát 24/7
  * Tìm kiếm nhanh bài hát, nhạc sĩ, nghệ sĩ, câu hát (Ctrl+K)
  * Dòng thời gian bài hát theo từng giai đoạn lịch sử
  * Bảng xếp hạng bài hát, nghệ sĩ và thành viên
  * Bình luận, yêu thích, playlist cá nhân, tải bài hát về máy
  * Giao diện sáng/tối, phím tắt bàn phím

  Website: https://bcdcnt.net
website: https://bcdcnt.net
contact: https://bcdcnt.net
license: Proprietary
icon: snap/gui/bcdcnt.png
adopt-info: bcdcnt
base: core24
grade: stable
confinement: strict
platforms:
  amd64:

# The Flutter bundle is built beforehand by `flutter build linux` (CI passes
# the dart-define secrets there), so this only repackages it plus libmpv,
# which media_kit dlopens at runtime for audio playback.
apps:
  bcdcnt:
    command: bcdcnt
    extensions: [gnome]
    plugs:
      - network
      - network-bind   # loopback redirect for desktop Google sign-in
      - audio-playback
      - home           # saving downloaded songs
    environment:
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/blas:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/lapack

parts:
  bcdcnt:
    plugin: dump
    source: build/linux/x64/release/bundle
    stage-packages:
      - libmpv2
    override-build: |
      craftctl default
      craftctl set version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' "$CRAFT_PROJECT_DIR/pubspec.yaml")"
