name: bcdcnt
description: BCĐCNT - Bài Ca Đi Cùng Năm Tháng
publish_to: 'none'
version: 1.4.0+13

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  crypto: ^3.0.0   # PKCE code-challenge for desktop Google Sign-In
  provider: ^6.1.2
  go_router: ^14.6.0
  shared_preferences: ^2.3.0
  cached_network_image: ^3.4.0
  just_audio: ^0.9.40
  audio_session: ^0.1.25
  # just_audio only ships native backends for iOS/Android/macOS/Web.
  # Windows & Linux desktop need a libmpv-backed implementation or
  # audio playback silently fails (duration stays at 0:00). Pulled
  # behind a `Platform.is*` guard in main.dart so mobile builds skip
  # the libmpv bindings entirely.
  just_audio_media_kit: ^2.0.6
  media_kit_libs_audio: ^1.0.5
  url_launcher: ^6.3.0
  flutter_html: ^3.0.0-beta.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  video_player: ^2.9.2
  chewie: ^1.8.5
  file_picker: ^8.1.4
  palette_generator: ^0.3.3+7
  web_socket_channel: ^3.0.0
  window_manager: ^0.4.3
  pasteboard: ^0.5.0
  flutter_quill: ^11.5.0
  flutter_quill_extensions: ^11.0.0
  vsc_quill_delta_to_html: ^1.0.5
  package_info_plus: ^8.0.0
  flutter_html_table: ^3.0.0-beta.2
  audio_service: ^0.18.19
  speech_to_text: ^7.4.0
  path_provider: ^2.1.6
  sign_in_with_apple: ^8.1.0
  google_sign_in: ^7.2.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  share_plus: ^12.0.2
  wakelock_plus: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  # Bundled (not fetched by google_fonts at runtime) so the first launch
  # renders with the right faces offline. Montserrat is the brand typeface
  # (tagline font in the BCĐCNT logo guideline) and is used for all text.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
